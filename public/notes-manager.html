<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學習分享平台 - NANI個人學習平台</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .learning-platform {
            padding: 40px 0;
            background: #0a0a0a;
            min-height: 100vh;
        }
        
        .platform-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .platform-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        
        .platform-title {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .platform-subtitle {
            color: #cccccc;
            font-size: 1.1rem;
        }
        
        .publish-btn {
            background: linear-gradient(135deg, #0066ff 0%, #1e3a8a 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .publish-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 102, 255, 0.3);
        }
        
        .editor-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            overflow-y: auto;
        }
        
        .editor-modal.active {
            display: block;
        }
        
        .editor-container {
            max-width: 900px;
            margin: 40px auto;
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid #333;
            min-height: 80vh;
        }
        
        .editor-header {
            padding: 30px 30px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .editor-title {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .editor-actions {
            display: flex;
            gap: 15px;
        }
        
        .btn-cancel {
            background: transparent;
            color: #cccccc;
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .btn-cancel:hover {
            background: #333;
            color: #ffffff;
        }
        
        .btn-publish {
            background: #0066ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-publish:hover {
            background: #0052cc;
        }
        
        .editor-form {
            padding: 30px;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .form-section h3 {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0a0a0a;
            color: #ffffff;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0066ff;
            box-shadow: 0 0 0 2px rgba(0, 102, 255, 0.2);
        }
        
        .form-group textarea {
            min-height: 200px;
            resize: vertical;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
        }
        
        .content-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            padding: 12px;
            background: #0a0a0a;
            border-radius: 8px;
            border: 1px solid #333;
            flex-wrap: wrap;
        }
        
        .toolbar-btn {
            background: #1a1a1a;
            color: #ffffff;
            border: 1px solid #333;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .toolbar-btn:hover {
            background: #0066ff;
            border-color: #0066ff;
        }
        
        .toolbar-btn i {
            font-size: 12px;
        }
        
        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .article-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 102, 255, 0.2);
            border-color: #0066ff;
        }
        
        .article-image {
            height: 200px;
            background: linear-gradient(135deg, #0066ff 0%, #1e3a8a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }
        
        .article-content {
            padding: 25px;
        }
        
        .article-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #cccccc;
        }
        
        .author-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #0066ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        
        .article-title {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .article-excerpt {
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .article-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .article-tag {
            background: rgba(0, 102, 255, 0.2);
            color: #0066ff;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .filters-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            background: #1a1a1a;
            color: #cccccc;
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            background: #0066ff;
            color: #ffffff;
            border-color: #0066ff;
        }
        
        .filter-btn:hover {
            background: #333;
            color: #ffffff;
        }
        
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            border: 1px solid #333;
        }
        
        .stat-number {
            color: #0066ff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .stat-label {
            color: #cccccc;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .platform-header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }
            
            .editor-actions {
                flex-direction: column;
            }
            
            .articles-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-graduation-cap"></i>
                <span>NANI學習平台</span>
            </div>
            
            <div class="nav-menu">
                <a href="index.html" class="nav-link">首頁</a>
                <a href="notes-manager.html" class="nav-link">學習分享</a>
                <a href="#about" class="nav-link">關於我</a>
            </div>
        </div>
    </nav>

    <!-- 主要內容 -->
    <main class="learning-platform">
        <div class="platform-container">
            <div class="platform-header">
                <div>
                    <h1 class="platform-title">學習分享平台</h1>
                    <p class="platform-subtitle">分享你的學習心得，與大家一起成長</p>
                </div>
                <button class="publish-btn" onclick="openEditor()">
                    <i class="fas fa-plus"></i>
                    發布文章
                </button>
            </div>

            <!-- 統計數據 -->
            <div class="stats-section">
                <div class="stat-card">
                    <div class="stat-number" id="totalArticles">0</div>
                    <div class="stat-label">總文章數</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalAuthors">0</div>
                    <div class="stat-label">作者數量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="managementArticles">0</div>
                    <div class="stat-label">管理學文章</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="englishArticles">0</div>
                    <div class="stat-label">英文文章</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="marketingArticles">0</div>
                    <div class="stat-label">行銷學文章</div>
                </div>
            </div>

            <!-- 篩選器 -->
            <div class="filters-section">
                <button class="filter-btn active" data-filter="all">全部文章</button>
                <button class="filter-btn" data-filter="管理學">管理學</button>
                <button class="filter-btn" data-filter="英文">英文</button>
                <button class="filter-btn" data-filter="行銷學">行銷學</button>
            </div>

            <!-- 文章列表 -->
            <div class="articles-grid" id="articlesGrid">
                <!-- 文章卡片將在這裡動態生成 -->
            </div>
        </div>
    </main>

    <!-- 編輯器模態框 -->
    <div class="editor-modal" id="editorModal">
        <div class="editor-container">
            <div class="editor-header">
                <h2 class="editor-title">撰寫新文章</h2>
                <div class="editor-actions">
                    <button class="btn-cancel" onclick="closeEditor()">取消</button>
                    <button class="btn-publish" onclick="publishArticle()">發布文章</button>
                </div>
            </div>
            
            <form class="editor-form" id="articleForm">
                <div class="form-section">
                    <h3>基本資訊</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="authorName">作者名稱 *</label>
                            <input type="text" id="authorName" name="authorName" placeholder="請輸入您的姓名" required>
                        </div>
                        <div class="form-group">
                            <label for="articleCategory">分類 *</label>
                            <select id="articleCategory" name="category" required>
                                <option value="">選擇分類</option>
                                <option value="管理學">管理學</option>
                                <option value="英文">英文</option>
                                <option value="行銷學">行銷學</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="articleTitle">文章標題 *</label>
                        <input type="text" id="articleTitle" name="title" placeholder="請輸入文章標題" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="articleTags">標籤</label>
                        <input type="text" id="articleTags" name="tags" placeholder="用逗號分隔多個標籤，例如：學習心得, 經驗分享, 技巧">
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>文章內容</h3>
                    <div class="content-toolbar">
                        <button type="button" class="toolbar-btn" onclick="insertHeading('h1')">
                            <i class="fas fa-heading"></i> H1
                        </button>
                        <button type="button" class="toolbar-btn" onclick="insertHeading('h2')">
                            <i class="fas fa-heading"></i> H2
                        </button>
                        <button type="button" class="toolbar-btn" onclick="insertHeading('h3')">
                            <i class="fas fa-heading"></i> H3
                        </button>
                        <button type="button" class="toolbar-btn" onclick="insertBold()">
                            <i class="fas fa-bold"></i> 粗體
                        </button>
                        <button type="button" class="toolbar-btn" onclick="insertItalic()">
                            <i class="fas fa-italic"></i> 斜體
                        </button>
                        <button type="button" class="toolbar-btn" onclick="insertList()">
                            <i class="fas fa-list"></i> 列表
                        </button>
                        <button type="button" class="toolbar-btn" onclick="insertQuote()">
                            <i class="fas fa-quote-left"></i> 引用
                        </button>
                        <button type="button" class="toolbar-btn" onclick="insertCode()">
                            <i class="fas fa-code"></i> 代碼
                        </button>
                    </div>
                    <div class="form-group">
                        <textarea id="articleContent" name="content" placeholder="開始撰寫您的學習心得...&#10;&#10;使用工具列快速插入格式：&#10;# 大標題&#10;## 中標題&#10;### 小標題&#10;**粗體文字**&#10;*斜體文字*&#10;- 列表項目&#10;> 引用文字&#10;`代碼片段`" required></textarea>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 文章數據存儲
        let articles = JSON.parse(localStorage.getItem('articles')) || [];
        let currentFilter = 'all';

        // 初始化頁面
        document.addEventListener('DOMContentLoaded', function() {
            loadArticles();
            updateStats();
            setupEventListeners();
            
            // 如果沒有文章，添加一些示例文章
            if (articles.length === 0) {
                addSampleArticles();
            }
        });

        // 添加示例文章
        function addSampleArticles() {
            const sampleArticles = [
                {
                    id: 1,
                    authorName: '張小明',
                    title: '我的英文學習心得：從零基礎到流利對話',
                    category: '英文',
                    content: `# 我的英文學習心得

## 學習背景
作為一個從零開始學習英文的學生，我想分享這一年來的學習心得和經驗。

## 學習方法
### 1. 每日堅持
- 每天至少學習30分鐘
- 使用多種學習資源
- 保持學習的連續性

### 2. 實用技巧
**聽力練習**：從簡單的Podcast開始
**口語練習**：與外國朋友交流
**閱讀練習**：從兒童讀物開始

## 學習成果
經過一年的努力，我已經能夠：
- 進行基本的日常對話
- 閱讀簡單的英文文章
- 理解大部分英文影片內容

> 學習語言最重要的是堅持，不要害怕犯錯，大膽開口說！

## 推薦資源
- Duolingo - 適合初學者
- BBC Learning English - 免費學習資源
- HelloTalk - 語言交換平台`,
                    tags: ['英文學習', '心得分享', '學習方法'],
                    createdAt: new Date().toISOString(),
                    readTime: '5分鐘'
                },
                {
                    id: 2,
                    authorName: '李美玲',
                    title: '管理學實戰經驗：如何有效管理團隊',
                    category: '管理學',
                    content: `# 管理學實戰經驗分享

## 管理理念
在過去三年的團隊管理經驗中，我總結出了一些實用的管理技巧。

## 核心原則
### 1. 溝通至上
**定期會議**：每週進行團隊會議
**開放溝通**：鼓勵員工提出建議
**透明管理**：分享公司目標和進度

### 2. 激勵機制
- 設定明確的目標
- 提供成長機會
- 認可員工貢獻

## 實戰技巧
### 衝突處理
當團隊出現衝突時：
1. 及時介入
2. 聽取各方意見
3. 尋找共同點
4. 制定解決方案

### 績效管理
\`\`\`
目標設定 → 執行監督 → 定期評估 → 反饋改進
\`\`\`

## 學習心得
管理是一門藝術，需要不斷學習和實踐。最重要的是要**以人為本**，關心團隊成員的成長和發展。`,
                    tags: ['團隊管理', '實戰經驗', '管理技巧'],
                    createdAt: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString(),
                    readTime: '8分鐘'
                }
            ];
            
            articles = sampleArticles;
            localStorage.setItem('articles', JSON.stringify(articles));
            loadArticles();
            updateStats();
        }

        // 設置事件監聽器
        function setupEventListeners() {
            // 篩選按鈕
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', handleFilter);
            });
        }

        // 打開編輯器
        function openEditor() {
            document.getElementById('editorModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 關閉編輯器
        function closeEditor() {
            document.getElementById('editorModal').classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('articleForm').reset();
        }

        // 發布文章
        function publishArticle() {
            const form = document.getElementById('articleForm');
            const formData = new FormData(form);
            
            // 驗證必填欄位
            if (!formData.get('authorName') || !formData.get('title') || !formData.get('category') || !formData.get('content')) {
                alert('請填寫所有必填欄位');
                return;
            }
            
            const article = {
                id: Date.now(),
                authorName: formData.get('authorName'),
                title: formData.get('title'),
                category: formData.get('category'),
                content: formData.get('content'),
                tags: formData.get('tags') ? formData.get('tags').split(',').map(tag => tag.trim()).filter(tag => tag) : [],
                createdAt: new Date().toISOString(),
                readTime: calculateReadTime(formData.get('content'))
            };
            
            articles.unshift(article); // 添加到開頭
            localStorage.setItem('articles', JSON.stringify(articles));
            
            loadArticles();
            updateStats();
            closeEditor();
            
            showMessage('文章發布成功！', 'success');
        }

        // 計算閱讀時間
        function calculateReadTime(content) {
            const wordsPerMinute = 200;
            const wordCount = content.split(/\s+/).length;
            const minutes = Math.ceil(wordCount / wordsPerMinute);
            return `${minutes}分鐘`;
        }

        // 內容工具列功能
        function insertHeading(level) {
            const textarea = document.getElementById('articleContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            
            let prefix = '';
            switch(level) {
                case 'h1': prefix = '# '; break;
                case 'h2': prefix = '## '; break;
                case 'h3': prefix = '### '; break;
            }
            
            const before = text.substring(0, start);
            const selected = text.substring(start, end);
            const after = text.substring(end);
            
            textarea.value = before + prefix + selected + after;
            textarea.focus();
            textarea.setSelectionRange(start + prefix.length, start + prefix.length + selected.length);
        }
        
        function insertBold() {
            insertFormat('**', '**');
        }
        
        function insertItalic() {
            insertFormat('*', '*');
        }
        
        function insertList() {
            const textarea = document.getElementById('articleContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            
            const before = text.substring(0, start);
            const selected = text.substring(start, end);
            const after = text.substring(end);
            
            const lines = selected.split('\n');
            const listItems = lines.map(line => line.trim() ? '- ' + line : line).join('\n');
            
            textarea.value = before + listItems + after;
            textarea.focus();
        }
        
        function insertQuote() {
            const textarea = document.getElementById('articleContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            
            const before = text.substring(0, start);
            const selected = text.substring(start, end);
            const after = text.substring(end);
            
            const lines = selected.split('\n');
            const quotedLines = lines.map(line => line.trim() ? '> ' + line : line).join('\n');
            
            textarea.value = before + quotedLines + after;
            textarea.focus();
        }
        
        function insertCode() {
            insertFormat('`', '`');
        }
        
        function insertFormat(before, after) {
            const textarea = document.getElementById('articleContent');
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            
            const beforeText = text.substring(0, start);
            const selected = text.substring(start, end);
            const afterText = text.substring(end);
            
            textarea.value = beforeText + before + selected + after + afterText;
            textarea.focus();
            textarea.setSelectionRange(start + before.length, start + before.length + selected.length);
        }

        // 處理篩選
        function handleFilter(e) {
            const filter = e.target.dataset.filter;
            currentFilter = filter;
            
            // 更新按鈕狀態
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            e.target.classList.add('active');
            
            // 篩選文章
            const filteredArticles = filter === 'all' ? articles : articles.filter(article => article.category === filter);
            renderArticles(filteredArticles);
        }

        // 載入文章
        function loadArticles() {
            const filteredArticles = currentFilter === 'all' ? articles : articles.filter(article => article.category === currentFilter);
            renderArticles(filteredArticles);
        }

        // 渲染文章
        function renderArticles(articlesToRender) {
            const grid = document.getElementById('articlesGrid');
            
            if (articlesToRender.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: #cccccc; grid-column: 1 / -1; font-size: 1.2rem; margin-top: 50px;">暫無文章</p>';
                return;
            }
            
            grid.innerHTML = articlesToRender.map(article => {
                const formattedDate = formatDate(article.createdAt);
                const excerpt = article.content.substring(0, 150) + (article.content.length > 150 ? '...' : '');
                const authorInitial = article.authorName.charAt(0);
                
                return `
                    <div class="article-card" onclick="viewArticle(${article.id})">
                        <div class="article-image">
                            <i class="fas fa-book-open"></i>
                        </div>
                        <div class="article-content">
                            <div class="article-meta">
                                <div class="author-avatar">${authorInitial}</div>
                                <span>${article.authorName}</span>
                                <span>•</span>
                                <span>${formattedDate}</span>
                                <span>•</span>
                                <span>${article.readTime}</span>
                            </div>
                            <h3 class="article-title">${article.title}</h3>
                            <p class="article-excerpt">${excerpt}</p>
                            ${article.tags.length > 0 ? `<div class="article-tags">${article.tags.map(tag => `<span class="article-tag">${tag}</span>`).join('')}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // 查看文章詳情
        function viewArticle(id) {
            const article = articles.find(a => a.id === id);
            if (article) {
                // 這裡可以實現文章詳情頁面
                alert(`查看文章：${article.title}\n\n這是一個示例，實際應用中可以跳轉到文章詳情頁面。`);
            }
        }
        
        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffTime = Math.abs(now - date);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 1) {
                return '今天';
            } else if (diffDays === 2) {
                return '昨天';
            } else if (diffDays <= 7) {
                return `${diffDays - 1}天前`;
            } else {
                return date.toLocaleDateString('zh-TW');
            }
        }

        // 更新統計
        function updateStats() {
            const authors = [...new Set(articles.map(article => article.authorName))];
            
            document.getElementById('totalArticles').textContent = articles.length;
            document.getElementById('totalAuthors').textContent = authors.length;
            document.getElementById('managementArticles').textContent = articles.filter(a => a.category === '管理學').length;
            document.getElementById('englishArticles').textContent = articles.filter(a => a.category === '英文').length;
            document.getElementById('marketingArticles').textContent = articles.filter(a => a.category === '行銷學').length;
        }

        // 顯示消息
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.style.cssText = `
                position: fixed;
                top: 100px;
                right: 20px;
                padding: 15px 20px;
                border-radius: 8px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                animation: slideIn 0.3s ease;
            `;
            
            if (type === 'success') {
                messageDiv.style.background = '#28a745';
            } else {
                messageDiv.style.background = '#dc3545';
            }
            
            messageDiv.textContent = message;
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }

        // 添加動畫樣式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
